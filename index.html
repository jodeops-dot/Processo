
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Explorer</title>

<style>
:root {
    --bg: #09090d;
    --panel: #111116;
    --panel2: #191920;
    --border: #292932;
    --text: #f5f5f7;
    --muted: #858590;
    --accent: #9b6cff;
    --accent2: #7040d9;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: var(--bg);
    color: var(--text);
    font-family: Inter, "Segoe UI", Arial, sans-serif;
    min-height: 100vh;
}

header {
    height: 75px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 5%;
    background: #0d0d12;
}

.logo {
    font-size: 21px;
    font-weight: 800;
    letter-spacing: -1px;
}

.logo span {
    color: var(--accent);
}

.header-info {
    color: var(--muted);
    font-size: 13px;
}

.container {
    max-width: 1150px;
    margin: auto;
    padding: 45px 25px 150px;
}

.welcome {
    margin-bottom: 30px;
}

.welcome h1 {
    font-size: 32px;
    margin-bottom: 8px;
}

.welcome p {
    color: var(--muted);
    font-size: 14px;
}

.toolbar {
    display: flex;
    gap: 12px;
    margin-bottom: 25px;
}

.search {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    color: white;
    border-radius: 10px;
    padding: 14px 16px;
    outline: none;
    font-size: 14px;
}

.search:focus {
    border-color: var(--accent);
}

.count {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 17px;
    color: var(--muted);
    font-size: 13px;
    white-space: nowrap;
}

.audio-list {
    display: flex;
    flex-direction: column;
    gap: 9px;
}

.audio-card {
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 15px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    transition: .2s;
}

.audio-card:hover {
    background: var(--panel2);
    border-color: #464052;
    transform: translateY(-1px);
}

.audio-icon {
    width: 43px;
    height: 43px;
    background: #241a36;
    color: #bd9aff;
    border-radius: 10px;
    display: grid;
    place-items: center;
    font-size: 19px;
    flex-shrink: 0;
}

.audio-info {
    flex: 1;
    min-width: 0;
}

.audio-name {
    font-size: 14px;
    font-weight: 650;
    margin-bottom: 5px;
}

.audio-id {
    color: var(--muted);
    font-size: 12px;
}

.actions {
    display: flex;
    gap: 8px;
}

button {
    cursor: pointer;
    border: none;
    font-family: inherit;
}

.play-btn {
    background: var(--accent);
    color: white;
    padding: 10px 15px;
    border-radius: 8px;
    font-weight: 700;
}

.play-btn:hover {
    background: var(--accent2);
}

.edit-btn {
    background: #25252e;
    color: #ddd;
    padding: 10px 13px;
    border-radius: 8px;
}

.edit-btn:hover {
    background: #353541;
}

.empty {
    display: none;
    text-align: center;
    color: var(--muted);
    padding: 50px 10px;
}

.player {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(15,15,21,.96);
    border-top: 1px solid var(--border);
    padding: 15px 5%;
    backdrop-filter: blur(15px);
    display: flex;
    align-items: center;
    gap: 20px;
    z-index: 10;
}

.player-info {
    min-width: 150px;
    flex: 1;
}

.player-title {
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 4px;
}

.player-subtitle {
    font-size: 11px;
    color: var(--muted);
}

audio {
    width: min(600px, 65%);
    height: 38px;
}

.modal-bg {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.75);
    z-index: 20;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal {
    background: #15151c;
    border: 1px solid var(--border);
    border-radius: 15px;
    width: 100%;
    max-width: 430px;
    padding: 25px;
}

.modal h2 {
    margin-bottom: 20px;
    font-size: 20px;
}

.field {
    margin-bottom: 17px;
}

.field label {
    display: block;
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 8px;
}

.field input {
    width: 100%;
    background: #0b0b10;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    color: white;
    outline: none;
}

.modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 22px;
}

.modal-actions button {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
}

.copy-btn {
    background: var(--accent);
    color: white;
}

.close-btn {
    background: #292932;
    color: white;
}

@media(max-width: 600px) {
    .container {
        padding: 30px 15px 140px;
    }

    .welcome h1 {
        font-size: 25px;
    }

    .audio-card {
        gap: 10px;
        padding: 11px;
    }

    .audio-icon {
        width: 38px;
        height: 38px;
    }

    .edit-btn {
        display: none;
    }

    .player {
        flex-wrap: wrap;
        gap: 10px;
    }

    .player-info {
        width: 100%;
    }

    audio {
        width: 100%;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">AUDIO<span>EXPLORER</span></div>
    <div class="header-info">Biblioteca pública de áudios</div>
</header>

<main class="container">

    <section class="welcome">
        <h1>Biblioteca de áudios</h1>
        <p>Explore, pesquise e reproduza os áudios disponíveis.</p>
    </section>

    <div class="toolbar">
        <input
            class="search"
            id="search"
            type="text"
            placeholder="Pesquisar áudio ou ID..."
        >
        <div class="count" id="count">79 áudios</div>
    </div>

    <div class="audio-list" id="audioList"></div>

    <div class="empty" id="empty">
        Nenhum áudio encontrado.
    </div>

</main>

<div class="player">
    <div class="player-info">
        <div class="player-title" id="playerTitle">Nenhum áudio selecionado</div>
        <div class="player-subtitle" id="playerSubtitle">Selecione um áudio para começar</div>
    </div>

    <audio id="audioPlayer" controls preload="none"></audio>
</div>

<div class="modal-bg" id="modalBg">
    <div class="modal">
        <h2>Informações do áudio</h2>

        <div class="field">
            <label>Nome do arquivo</label>
            <input id="modalName" readonly>
        </div>

        <div class="field">
            <label>ID</label>
            <input id="modalId" readonly>
        </div>

        <div class="field">
            <label>Link direto</label>
            <input id="modalLink" readonly>
        </div>

        <div class="modal-actions">
            <button class="copy-btn" onclick="copyLink()">Copiar link</button>
            <button class="close-btn" onclick="closeModal()">Fechar</button>
        </div>
    </div>
</div>

<script>
const TOTAL_AUDIOS = 79;

const audioList = document.getElementById("audioList");
const searchInput = document.getElementById("search");
const countElement = document.getElementById("count");
const emptyElement = document.getElementById("empty");

const player = document.getElementById("audioPlayer");
const playerTitle = document.getElementById("playerTitle");
const playerSubtitle = document.getElementById("playerSubtitle");

let selectedAudio = null;

const audios = Array.from({ length: TOTAL_AUDIOS }, (_, index) => {
    const number = index + 1;

    return {
        id: `audio-${number}`,
        name: `audio ${number}.ogg`,
        number: number,
        src: `./audio%20${number}.ogg`
    };
});

function renderAudios(filter = "") {
    audioList.innerHTML = "";

    const normalizedFilter = filter.toLowerCase().trim();

    const filtered = audios.filter(audio =>
        audio.name.toLowerCase().includes(normalizedFilter) ||
        audio.id.toLowerCase().includes(normalizedFilter)
    );

    countElement.textContent =
        `${filtered.length} de ${audios.length} áudios`;

    emptyElement.style.display =
        filtered.length === 0 ? "block" : "none";

    filtered.forEach(audio => {
        const card = document.createElement("div");
        card.className = "audio-card";
        card.id = `card-${audio.id}`;

        card.innerHTML = `
            <div class="audio-icon">♫</div>

            <div class="audio-info">
                <div class="audio-name">${audio.name}</div>
                <div class="audio-id">ID: ${audio.id}</div>
            </div>

            <div class="actions">
                <button class="edit-btn">Editar</button>
                <button class="play-btn">▶ Reproduzir</button>
            </div>
        `;

        card.querySelector(".play-btn").addEventListener("click", () => {
            playAudio(audio);
        });

        card.querySelector(".edit-btn").addEventListener("click", () => {
            openModal(audio);
        });

        audioList.appendChild(card);
    });
}

function playAudio(audio) {
    selectedAudio = audio;

    player.src = audio.src;
    playerTitle.textContent = audio.name;
    playerSubtitle.textContent = `ID: ${audio.id}`;

    player.play().catch(error => {
        console.log("A reprodução precisa ser iniciada pelo usuário:", error);
    });

    history.replaceState(null, "", `#${audio.id}`);

    document.querySelectorAll(".audio-card").forEach(card => {
        card.style.borderColor = "";
    });

    const selectedCard = document.getElementById(`card-${audio.id}`);

    if (selectedCard) {
        selectedCard.style.borderColor = "#9b6cff";
    }
}

function openModal(audio) {
    const link = new URL(audio.src, window.location.href).href;

    document.getElementById("modalName").value = audio.name;
    document.getElementById("modalId").value = audio.id;
    document.getElementById("modalLink").value = link;

    document.getElementById("modalBg").style.display = "flex";
}

function closeModal() {
    document.getElementById("modalBg").style.display = "none";
}

function copyLink() {
    const link = document.getElementById("modalLink");

    navigator.clipboard.writeText(link.value)
        .then(() => {
            document.querySelector(".copy-btn").textContent = "Copiado!";
            setTimeout(() => {
                document.querySelector(".copy-btn").textContent = "Copiar link";
            }, 1500);
        })
        .catch(() => {
            link.select();
            document.execCommand("copy");
        });
}

searchInput.addEventListener("input", event => {
    renderAudios(event.target.value);
});

function openHashAudio() {
    const hash = decodeURIComponent(window.location.hash.substring(1));

    if (!hash) return;

    const audio = audios.find(item => item.id === hash);

    if (audio) {
        playAudio(audio);
    }
}

document.getElementById("modalBg").addEventListener("click", event => {
    if (event.target.id === "modalBg") {
        closeModal();
    }
});

renderAudios();

openHashAudio();

window.addEventListener("hashchange", openHashAudio);
</script>

</body>
</html>
